<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boston Community Support – Radial Conversation</title>
  <style>
    :root {
      --bg: #faf8f3;
      --question-bg: #ffffff;
      --response-bg: #fcd9b8;
      --link-color: #dedede;
      --text-dark: #222222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      background: var(--bg);
    }

    .graph-wrapper {
      flex: 1 1 auto;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    .graph-card {
      width: 100%;
      height: 100%;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: hidden;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 600px;
    }

    .side-panel {
      position: sticky;
      top: 0;
      right: 0;
      width: min(420px, 35%);
      min-width: 320px;
      height: 100vh;
      background: #ffffff;
      box-shadow: -12px 0 30px rgba(15, 23, 42, 0.15);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.35s ease;
      z-index: 5;
    }

    .panel-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.75rem;
      color: #666666;
      margin: 0;
    }

    #panel-name {
      font-size: 1.75rem;
      margin: 0;
    }

    #panel-quote {
      line-height: 1.6;
      margin: 0;
      white-space: pre-line;
    }

    .instruction {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: rgba(255, 255, 255, 0.9);
      padding: 0.65rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    @media (max-width: 960px) {
      body {
        flex-direction: column;
        min-height: auto;
      }

      .graph-wrapper {
        padding: 1rem;
        min-height: 60vh;
      }

      .side-panel {
        position: relative;
        width: 100%;
        min-width: 0;
        height: auto;
        min-height: 35vh;
        transform: translateY(0);
        box-shadow: 0 -12px 30px rgba(15, 23, 42, 0.12);
      }
    }
  </style>
</head>
<body>
  <main class="graph-wrapper">
    <div class="graph-card">
      <div class="instruction">Scroll or drag to explore; click dots or cards to open the full story.</div>
      <svg id="radial-graph" aria-label="Community support responses"></svg>
    </div>
  </main>

  <aside id="detail-panel" class="side-panel" aria-live="polite">
    <p class="panel-label">Selected Response</p>
    <h2 id="panel-name">Pick a voice</h2>
    <p id="panel-quote">Tap a response node to read the full story.</p>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    const conversations = [
      {
        id: "support",
        title: "Feeling Supported",
        question:
          "Could you describe a specific time when you felt really supported by your community in Boston?",
        responses: [
          {
            speaker: "Miliani",
            quote:
              "It was during the Boston Marathon bombing. President Obama came to the Cathedral Church near my house and the community gathered with signs and support. Being there with my family and seeing everyone come together made me feel truly supported.",
            highlight:
              "Neighbors and even the President showed up—Boston held us after the marathon bombing."
          },
          {
            speaker: "Gabby",
            quote:
              "When I went to school in Boston most classmates were Dominican like me. We supported each other through that shared experience, even if I can't recall a single defining moment."
          },
          {
            speaker: "Christelle",
            quote:
              "As an adult it's been harder to feel part of a community because making friends is tougher than it was in high school or college. I can't point to a time when I felt supported recently."
          },
          {
            speaker: "Nicole",
            quote:
              "During my time in Boston, especially when I attended a bilingual school, most students were Caribbean. Like Gabby said, we related to each other and felt supported, especially with programs like teaching Spanish to other kids."
          },
          {
            speaker: "Nina",
            quote:
              "After the first Trump win, many classmates—mostly immigrants—were scared about deportation. School felt heavy, but we experienced it together and no one felt fully alone."
          },
          {
            speaker: "Lauren",
            quote:
              "Moving to Boston meant living alone and feeling anxious. During my first big snowstorm, coworkers and even near-strangers made sure I had food and a place to stay. Their care helped me feel welcome.",
            highlight:
              "Snowed in and terrified, coworkers stocked me with food and made Boston feel kind."
          },
          {
            speaker: "Sarah",
            quote:
              "In my teenage years I performed poetry around Boston. The support from peers and adults who showed up to our shows made me feel deeply supported by the community."
          }
        ]
      },
      {
        id: "journey",
        title: "Journey to Boston",
        question:
          "When was a time when you felt supported by your community in Boston?",
        responses: [
          {
            speaker: "Sarah",
            quote:
              "My dad's side is rooted in Roxbury while my mom came east from California after housing instability. We bounced between cities before settling in Dorchester and Roxbury—places full of memories, challenges, violence, and now new resources.",
            highlight:
              "We ping-ponged cities before Roxbury—Boston holds our memories along with the scars."
          },
          {
            speaker: "Nina",
            quote:
              "My mom's family fled domestic violence in the Bronx and landed in Dorchester before moving to Chelsea, while my dad left the Dominican Republic for work. Chelsea is full of pride even as it grapples with poverty and community violence."
          },
          {
            speaker: "Christelle",
            quote:
              "I was born in Haiti and moved here at seven. After a short stay in Connecticut we joined family in Mattapan, moved to Jamaica Plain that I loved, and now live in Dorchester while hoping to reach Quincy. Violence and gentrification shape each neighborhood.",
            highlight:
              "From Haiti to Mattapan to JP, every move chased safety even as violence kept inching closer."
          },
          {
            speaker: "Abby",
            quote:
              "I grew up in Boston, attending a bilingual school and then a charter school. My parents immigrated from the Dominican Republic for better education opportunities, and we recently moved away when our home got too crowded."
          },
          {
            speaker: "Nicole",
            quote:
              "My family left the Dominican Republic for better jobs and schools in Dorchester. Our block felt safe even if nearby streets did not, and eventually we moved to a smaller town for stronger schools and a calmer environment."
          },
          {
            speaker: "Miliani",
            quote:
              "My grandfather came from the Dominican Republic and my grandmother from Puerto Rico. I've lived in Boston's South End most of my life—it feels good overall even though a couple of nearby streets still struggle with violence."
          },
          {
            speaker: "Lauren",
            quote:
              "I'm a transplant from New Jersey who moved from New York City to Boston four years ago for work. I was hesitant but Boston keeps winning me over and convincing me to stay."
          }
        ]
      }
    ];

    const pastelPalette = ["#CFEFD6", "#E9D6FF", "#D7ECFF", "#FFD8C6"];
    const canvasBackground = "#faf8f3";
    const spokeColor = "#e7e3dc";
    const dotRadius = 12;
    const anchorRadius = 5;
    const cardWidth = 220;
    const cardHeight = 70;
    const questionWidth = 260;
    const questionFont = "Inter, 'Helvetica Neue', sans-serif";

    const withOpacity = (hex, opacity) => {
      const color = d3.color(hex);
      if (!color) return hex;
      const clone = color.copy();
      clone.opacity = opacity;
      return clone.toString();
    };

    const svg = d3.select("#radial-graph");
    const panel = document.getElementById("detail-panel");
    const panelName = document.getElementById("panel-name");
    const panelQuote = document.getElementById("panel-quote");
    let simulation;
    let zoomLayer;

    const zoomBehavior = d3
      .zoom()
      .scaleExtent([0.5, 3])
      .on("zoom", event => {
        if (zoomLayer) {
          zoomLayer.attr("transform", event.transform);
        }
      });

    svg.call(zoomBehavior).on("dblclick.zoom", null);

    const resize = () => {
      const { width, height } = svg.node().getBoundingClientRect();
      svg.attr("viewBox", `0 0 ${width} ${height}`);
      return { width, height };
    };

    const createArcPath = (source, target, bendScale = 0.22) => {
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const midX = (source.x + target.x) / 2;
      const midY = (source.y + target.y) / 2;
      const length = Math.hypot(dx, dy) || 1;
      const bend = Math.min(140, length * bendScale);
      const nx = (-dy / length) * bend;
      const ny = (dx / length) * bend;
      return `M ${source.x},${source.y} Q ${midX + nx},${midY + ny} ${target.x},${target.y}`;
    };

    const renderGraph = () => {
      svg.selectAll("*").remove();
      svg.style("background", canvasBackground);
      zoomLayer = svg.append("g").attr("class", "zoom-layer");
      const currentTransform = d3.zoomTransform(svg.node());
      zoomLayer.attr("transform", currentTransform);

      if (simulation) {
        simulation.stop();
      }

      const { width, height } = resize();
      const horizontalPadding = Math.min(width * 0.18, 240);
      const availableWidth = Math.max(width - horizontalPadding * 2, 360);
      const step =
        conversations.length > 1 ? availableWidth / (conversations.length - 1) : 0;
      const orbitRadius = Math.min(availableWidth / conversations.length, height) * 0.5;

      const clusterCenters = conversations.map((conversation, index) => {
        const x =
          conversations.length > 1
            ? horizontalPadding + step * index
            : width / 2;
        return {
          id: conversation.id,
          x,
          y: height / 2
        };
      });
      const centerById = Object.fromEntries(clusterCenters.map(center => [center.id, center]));

      const nodes = [];
      const links = [];

      conversations.forEach((conversation, convIndex) => {
        const center = centerById[conversation.id];
        const questionNode = {
          id: `${conversation.id}-question`,
          type: "question",
          title: conversation.title,
          text: conversation.question,
          cluster: conversation.id,
          x: center.x,
          y: center.y,
          fx: center.x,
          fy: center.y
        };
        nodes.push(questionNode);

        const angleStep = (2 * Math.PI) / conversation.responses.length;
        conversation.responses.forEach((response, responseIndex) => {
          const angle = responseIndex * angleStep - Math.PI / 2;
          const display = response.highlight ? "card" : "dot";
          const paletteIndex =
            (convIndex * conversation.responses.length + responseIndex) % pastelPalette.length;
          const color = pastelPalette[paletteIndex];
          const radialOffset =
            display === "card"
              ? orbitRadius + 120
              : orbitRadius + (responseIndex % 2 === 0 ? -20 : 15);
          const x = center.x + radialOffset * Math.cos(angle);
          const y = center.y + radialOffset * Math.sin(angle);

          const responseNode = {
            id: `${conversation.id}-response-${responseIndex}`,
            type: "response",
            cluster: conversation.id,
            speaker: response.speaker,
            quote: response.quote,
            highlight: response.highlight,
            display,
            color,
            angle,
            x,
            y
          };

          nodes.push(responseNode);
          links.push({
            source: questionNode.id,
            target: responseNode.id
          });
        });
      });

      const linkGroup = zoomLayer.append("g");
      const linkElements = linkGroup
        .selectAll("path")
        .data(links)
        .enter()
        .append("path")
        .attr("fill", "none")
        .attr("stroke", spokeColor)
        .attr("stroke-width", 1)
        .attr("stroke-linecap", "round");

      const nodeGroup = zoomLayer.append("g");
      const nodesSelection = nodeGroup
        .selectAll("g.node")
        .data(nodes, d => d.id)
        .enter()
        .append("g")
        .attr("class", d => `node ${d.type}`)
        .style("cursor", "pointer")
        .on("click", (event, d) => updatePanel(d));

      const questionSelection = nodesSelection.filter(d => d.type === "question");
      questionSelection
        .append("foreignObject")
        .attr("x", -questionWidth / 2)
        .attr("y", -60)
        .attr("width", questionWidth)
        .attr("height", 100)
        .append("xhtml:div")
        .style("font-family", questionFont)
        .style("text-align", "center")
        .style("font-size", "15px")
        .style("font-weight", "500")
        .style("color", "#3c3a34")
        .style("line-height", "1.45")
        .style("pointer-events", "none")
        .text(d => d.text);

      const dotSelection = nodesSelection.filter(
        d => d.type === "response" && d.display === "dot"
      );
      dotSelection
        .append("circle")
        .attr("r", dotRadius)
        .attr("fill", d => withOpacity(d.color, 0.8))
        .attr("stroke", d => d.color)
        .attr("stroke-width", 1);

      const cardSelection = nodesSelection.filter(
        d => d.type === "response" && d.display === "card"
      );
      cardSelection
        .append("circle")
        .attr("class", "anchor-dot")
        .attr("r", anchorRadius)
        .attr("fill", d => withOpacity(d.color, 0.7))
        .attr("stroke", "none");

      cardSelection
        .append("foreignObject")
        .attr("width", cardWidth)
        .attr("height", cardHeight)
        .attr("x", d => (d.angle > Math.PI / 2 || d.angle < -Math.PI / 2 ? -(cardWidth + 12) : 12))
        .attr("y", -cardHeight / 2)
        .append("xhtml:div")
        .style("width", "100%")
        .style("height", "100%")
        .style("background", d => d.color)
        .style("border-radius", "18px")
        .style("box-shadow", "0 8px 24px rgba(30, 30, 30, 0.08)")
        .style("font-family", questionFont)
        .style("font-size", "14px")
        .style("font-style", "italic")
        .style("color", "#3c3a34")
        .style("padding", "20px")
        .style("display", "flex")
        .style("align-items", "center")
        .style("justify-content", "center")
        .style("line-height", "1.35")
        .style("pointer-events", "none")
        .text(d => d.highlight || "");

      const nodesById = Object.fromEntries(nodes.map(node => [node.id, node]));

      simulation = d3
        .forceSimulation(nodes)
        .force(
          "link",
          d3
            .forceLink(links)
            .id(d => d.id)
            .distance(orbitRadius * 0.8)
            .strength(0.4)
        )
        .force(
          "charge",
          d3.forceManyBody().strength(d => (d.type === "question" ? -800 : -200))
        )
        .force(
          "collision",
          d3.forceCollide().radius(d => {
            if (d.type === "question") {
              return 140;
            }
            if (d.display === "card") {
              return Math.sqrt(cardWidth * cardWidth + cardHeight * cardHeight) / 2;
            }
            return dotRadius * 2.5;
          })
        )
        .force(
          "clusterX",
          d3.forceX(d => centerById[d.cluster].x).strength(0.1)
        )
        .force(
          "clusterY",
          d3.forceY(height / 2).strength(0.08)
        )
        .alpha(1)
        .restart();

      const blockZoom = nativeEvent => {
        if (nativeEvent && typeof nativeEvent.stopPropagation === "function") {
          nativeEvent.stopPropagation();
        }
      };

      const dragBehavior = d3
        .drag()
        .on("start", (event, d) => {
          blockZoom(event.sourceEvent);
          if (!event.active) simulation.alphaTarget(0.25).restart();
          d.fx = d.x;
          d.fy = d.y;
        })
        .on("drag", (event, d) => {
          blockZoom(event.sourceEvent);
          d.fx = event.x;
          d.fy = event.y;
        })
        .on("end", (event, d) => {
          blockZoom(event.sourceEvent);
          if (!event.active) simulation.alphaTarget(0);
          if (d.type !== "question") {
            d.fx = null;
            d.fy = null;
          }
        });

      dotSelection.call(dragBehavior);

      simulation.on("tick", () => {
        linkElements.attr("d", d => {
          const source = nodesById[d.source.id || d.source];
          const target = nodesById[d.target.id || d.target];
          if (!source || !target) return "";
          const gap =
            target.display === "card" ? anchorRadius : dotRadius + 4;
          const dx = target.x - source.x;
          const dy = target.y - source.y;
          const length = Math.hypot(dx, dy) || 1;
          const endX = target.x - (dx / length) * gap;
          const endY = target.y - (dy / length) * gap;
          return createArcPath(source, { x: endX, y: endY });
        });

        nodesSelection.attr("transform", d => `translate(${d.x}, ${d.y})`);
      });
    };

    const updatePanel = node => {
      panelName.textContent = node.type === "question" ? node.title : node.speaker;
      panelQuote.textContent = node.type === "question" ? node.text : node.quote;
    };

    window.addEventListener("resize", renderGraph);
    renderGraph();
  </script>
</body>
</html>
